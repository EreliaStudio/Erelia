name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GALLIUM_DRIVER: llvmpipe
  MESA_GL_VERSION_OVERRIDE: '4.6'
  MESA_GLSL_VERSION_OVERRIDE: '460'

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==21.1.0
      - name: Check current C++ code
        run: find core server client tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 | xargs -0 -r clang-format --style=file --dry-run --Werror

  headless:
    name: Core and Server (${{ matrix.os }}, ${{ matrix.configuration }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: EreliaStudio/Sparkle
          ref: Version-0.1.3
          path: Sparkle
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build libgtest-dev
      - name: Build Sparkle Core on Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S Sparkle -B build/sparkle-core -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_INSTALL_PREFIX="$PWD/build/sparkle-core-install" -DSPARKLE_BUILD_GRAPHICS=OFF -DSPARKLE_BUILD_TESTS=OFF
          cmake --build build/sparkle-core --parallel 4
          cmake --install build/sparkle-core
      - name: Build Erelia on Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build/erelia -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_PREFIX_PATH="$PWD/build/sparkle-core-install" -DERELIA_BUILD_CLIENT=OFF -DBUILD_TESTING=ON
          cmake --build build/erelia --parallel 4
          ctest --test-dir build/erelia --output-on-failure --no-tests=error
      - name: Build Sparkle Core on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SPARKLE_SOURCE_DIR: ${{ github.workspace }}/Sparkle
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          ./tools/dev/prepare-sparkle.ps1 -Configuration ${{ matrix.configuration }} -Variant Core
      - name: Build Erelia on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $preset = 'headless-${{ matrix.configuration }}'.ToLowerInvariant()
          cmake --preset $preset
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset $preset --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset $preset --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  client:
    name: Client (Windows, ${{ matrix.configuration }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: EreliaStudio/Sparkle
          ref: Version-0.1.3
          path: Sparkle
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build and install Sparkle
        shell: pwsh
        env:
          SPARKLE_SOURCE_DIR: ${{ github.workspace }}/Sparkle
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          ./tools/dev/prepare-sparkle.ps1 -Configuration ${{ matrix.configuration }}
      - name: Build and test Erelia
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          $preset = '${{ matrix.configuration }}'.ToLowerInvariant()
          cmake --preset $preset
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset $preset --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./Sparkle/tools/ci/install-mesa.ps1 -Destination "build/$preset/tests/client"
          ctest --preset $preset --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
