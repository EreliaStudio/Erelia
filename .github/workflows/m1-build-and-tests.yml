name: M1 Scaffold Build and CTest

on:
  push:
    branches:
      - feat/m1-engineering-scaffold
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Windows C++23 build / five CTest families
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      ERELIA_VCPKG_ROOT: ${{ github.workspace }}\_deps\vcpkg
    steps:
      - name: Checkout Erelia
        uses: actions/checkout@v4
        with:
          path: erelia

      - name: Checkout pinned, unmodified Sparkle v0.1.3
        uses: actions/checkout@v4
        with:
          repository: EreliaStudio/Sparkle
          ref: 5117c64a7052457ca2de1864bf23e0e29487bdcf
          path: _deps/sparkle-source

      - name: Checkout pinned vcpkg for external dependencies
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 817892b0ecbc6af994dd6df999c73faf795adbf2
          path: _deps/vcpkg

      - name: Enable MSVC toolchain environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Windows dependencies
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:ERELIA_VCPKG_ROOT
          & "$env:ERELIA_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:ERELIA_VCPKG_ROOT\vcpkg.exe" install glew stb gtest --triplet x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installed Sparkle package (outside its source tree)
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:ERELIA_VCPKG_ROOT
          cmake -S _deps/sparkle-source -B _out/sparkle-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang-cl `
            "-DCMAKE_TOOLCHAIN_FILE=$env:ERELIA_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DSPARKLE_BUILD_TESTS=OFF -DSPARKLE_BUILD_TEST_LIBRARY=OFF `
            "-DCMAKE_INSTALL_PREFIX=$env:GITHUB_WORKSPACE/_out/sparkle-prefix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build _out/sparkle-build --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install _out/sparkle-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure and compile Erelia
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:ERELIA_VCPKG_ROOT
          cmake -S erelia -B _out/erelia-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang-cl `
            "-DCMAKE_TOOLCHAIN_FILE=$env:ERELIA_VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            "-DCMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE/_out/sparkle-prefix" `
            -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build _out/erelia-build --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run independent CTest family reports
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _out/test-reports | Out-Null
          $failed = $false
          foreach ($family in @('Core', 'Client', 'Server', 'SparkleAddon', 'ClientServerIntegration')) {
            Write-Host "Running CTest family: $family"
            ctest --test-dir _out/erelia-build --output-on-failure `
              -L "^$family$" `
              --output-junit "${{ github.workspace }}/_out/test-reports/$family.xml"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Upload per-family JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-scaffold-ctest-windows
          path: _out/test-reports/*.xml
          if-no-files-found: warn
