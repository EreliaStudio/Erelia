name: M1 Engineering Foundation - independent Windows checks

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Each numbered stage is a separate GitHub Actions job/check, not merely a step.
# The build runs only once; downstream stages reuse its binaries and CTest files.
jobs:
  build:
    name: "00 - Compile Erelia and installed Sparkle"
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      has_traceability: ${{ steps.detect.outputs.has_traceability }}
    steps:
      - name: Checkout Erelia
        uses: actions/checkout@v4
        with:
          path: erelia

      - name: Checkout pinned, unmodified Sparkle v0.1.3
        uses: actions/checkout@v4
        with:
          repository: EreliaStudio/Sparkle
          ref: 5117c64a7052457ca2de1864bf23e0e29487bdcf
          path: _deps/sparkle-source

      - name: Checkout pinned vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 817892b0ecbc6af994dd6df999c73faf795adbf2
          path: _deps/vcpkg

      - name: Initialize Windows C++23 build tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install external build dependencies
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE '_deps/vcpkg'
          $env:VCPKG_ROOT = $root
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $root 'vcpkg.exe') install glew stb gtest --triplet x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and install Sparkle 0.1.3 externally
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE '_deps/vcpkg'
          $env:VCPKG_ROOT = $root
          cmake -S _deps/sparkle-source -B _out/sparkle-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang-cl `
            "-DCMAKE_TOOLCHAIN_FILE=$root/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DSPARKLE_BUILD_TESTS=OFF -DSPARKLE_BUILD_TEST_LIBRARY=OFF `
            "-DCMAKE_INSTALL_PREFIX=$env:GITHUB_WORKSPACE/_out/sparkle-prefix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build _out/sparkle-build --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install _out/sparkle-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure and compile Erelia Core, Client, Router and every discovered node
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE '_deps/vcpkg'
          $env:VCPKG_ROOT = $root
          cmake -S erelia -B _out/erelia-build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang-cl `
            "-DCMAKE_TOOLCHAIN_FILE=$root/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            "-DCMAKE_PREFIX_PATH=$env:GITHUB_WORKSPACE/_out/sparkle-prefix" `
            -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build _out/erelia-build --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Detect M1 traceability validator
        id: detect
        shell: pwsh
        run: |
          $exists = Test-Path 'erelia/tools/traceability.py'
          "has_traceability=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $exists) {
            Write-Host '::notice title=Traceability deferred::Validator unavailable; separate M1 tooling Story is required.'
          }
      - name: Share compiled executables and CTest discovery files
        uses: actions/upload-artifact@v4
        with:
          name: erelia-m1-ci-build
          path: _out/erelia-build/
          if-no-files-found: error
          compression-level: 1
          retention-days: 2

  addon_core:
    name: "01 - Sparkle Addon / Core"
    needs: build
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout Erelia
        uses: actions/checkout@v4
        with:
          path: erelia
      - name: Download previously built Erelia executables and CTest metadata
        uses: actions/download-artifact@v4
        with:
          name: erelia-m1-ci-build
          path: _out/erelia-build
      - name: Run CTest family
        shell: pwsh
        run: |
          & erelia/cmake/RunCTestFamily.ps1 -BuildDirectory _out/erelia-build -Family SparkleAddonCore -ReportDirectory _out/test-reports

      - name: Upload addon_core JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erelia-addon_core-ctest
          path: _out/test-reports/*.xml
          if-no-files-found: warn

  addon_graphics:
    name: "02 - Sparkle Addon / Graphics (if present)"
    needs: addon_core
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout Erelia
        uses: actions/checkout@v4
        with:
          path: erelia
      - name: Download previously built Erelia executables and CTest metadata
        uses: actions/download-artifact@v4
        with:
          name: erelia-m1-ci-build
          path: _out/erelia-build
      - name: Run CTest family
        shell: pwsh
        run: |
          & erelia/cmake/RunCTestFamily.ps1 -BuildDirectory _out/erelia-build -Family SparkleAddonGraphics -ReportDirectory _out/test-reports -Optional

      - name: Upload addon_graphics JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erelia-addon_graphics-ctest
          path: _out/test-reports/*.xml
          if-no-files-found: warn

  core:
    name: "03 - Erelia / Core"
    needs: addon_graphics
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout Erelia
        uses: actions/checkout@v4
        with:
          path: erelia
      - name: Download previously built Erelia executables and CTest metadata
        uses: actions/download-artifact@v4
        with:
          name: erelia-m1-ci-build
          path: _out/erelia-build
      - name: Run CTest family
        shell: pwsh
        run: |
          & erelia/cmake/RunCTestFamily.ps1 -BuildDirectory _out/erelia-build -Family Core -ReportDirectory _out/test-reports

      - name: Upload core JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erelia-core-ctest
          path: _out/test-reports/*.xml
          if-no-files-found: warn

  router:
    name: "04 - Erelia / Router"
    needs: core
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout Erelia
        uses: actions/checkout@v4
        with:
          path: erelia
      - name: Download previously built Erelia executables and CTest metadata
        uses: actions/download-artifact@v4
        with:
          name: erelia-m1-ci-build
          path: _out/erelia-build
      - name: Run CTest family
        shell: pwsh
        run: |
          & erelia/cmake/RunCTestFamily.ps1 -BuildDirectory _out/erelia-build -Family Router -ReportDirectory _out/test-reports

      - name: Upload router JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erelia-router-ctest
          path: _out/test-reports/*.xml
          if-no-files-found: warn

  client:
    name: "05 - Erelia / Client"
    needs: router
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout Erelia
        uses: actions/checkout@v4
        with:
          path: erelia
      - name: Download previously built Erelia executables and CTest metadata
        uses: actions/download-artifact@v4
        with:
          name: erelia-m1-ci-build
          path: _out/erelia-build
      - name: Run CTest family
        shell: pwsh
        run: |
          & erelia/cmake/RunCTestFamily.ps1 -BuildDirectory _out/erelia-build -Family Client -ReportDirectory _out/test-reports

      - name: Upload client JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erelia-client-ctest
          path: _out/test-reports/*.xml
          if-no-files-found: warn

  server:
    name: "06 - Erelia / Server"
    needs: client
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout Erelia
        uses: actions/checkout@v4
        with:
          path: erelia
      - name: Download previously built Erelia executables and CTest metadata
        uses: actions/download-artifact@v4
        with:
          name: erelia-m1-ci-build
          path: _out/erelia-build
      - name: Run CTest family
        shell: pwsh
        run: |
          & erelia/cmake/RunCTestFamily.ps1 -BuildDirectory _out/erelia-build -Family Server -ReportDirectory _out/test-reports

      - name: Upload server JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erelia-server-ctest
          path: _out/test-reports/*.xml
          if-no-files-found: warn

  integration:
    name: "07 - Integration / CTest (Python MockPlayer pending)"
    needs: server
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout Erelia
        uses: actions/checkout@v4
        with:
          path: erelia
      - name: Download previously built Erelia executables and CTest metadata
        uses: actions/download-artifact@v4
        with:
          name: erelia-m1-ci-build
          path: _out/erelia-build
      - name: Run C++ integration tests and report graphical test availability
        shell: pwsh
        run: |
          & erelia/cmake/RunCTestFamily.ps1 -BuildDirectory _out/erelia-build -Family ClientServerIntegration -ReportDirectory _out/test-reports
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Hosted windows-2022 runners cannot be treated as interactive
          # desktops suitable for real SendInput/window-capture validation.
          if (Test-Path 'erelia/tests/python/run_scenarios.py') {
            Write-Host '::error title=Interactive runner missing::Python MockPlayer integration must run on a dedicated interactive Windows desktop, not windows-2022. Configure that runner before enabling this gate.'
            exit 1
          }
          Write-Host '::warning title=MockPlayer not implemented::Only C++ integration CTest ran. Python real-input and screenshot tests are pending their own M1 Story and interactive runner.'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Python MockPlayer / graphical integration: **NOT RUN** (framework and interactive desktop pending).'

      - name: Upload integration JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erelia-integration-ctest
          path: _out/test-reports/*.xml
          if-no-files-found: warn

  traceability:
    name: "08 - Specification traceability (when implemented)"
    needs: [build, integration]
    if: ${{ needs.build.outputs.has_traceability == 'true' }}
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout Erelia
        uses: actions/checkout@v4
        with:
          path: erelia
      - name: Validate generated traceability without modifying specifications
        shell: pwsh
        run: |
          python erelia/tools/traceability.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  package:
    name: "09 - Downloadable Client, Router and Servers"
    needs: [integration, traceability, linux_tests]
    if: ${{ always() && needs.integration.result == 'success' && needs.linux_tests.result == 'success' && (needs.traceability.result == 'success' || needs.traceability.result == 'skipped') }}
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout Erelia
        uses: actions/checkout@v4
        with:
          path: erelia
      - name: Download previously built Erelia executables and CTest metadata
        uses: actions/download-artifact@v4
        with:
          name: erelia-m1-ci-build
          path: _out/erelia-build
      - name: "09 - Prepare downloadable Windows build preview"
        shell: pwsh
        run: |
          $appBuild = Join-Path $env:GITHUB_WORKSPACE '_out/erelia-build/apps'
          $stage = Join-Path $env:GITHUB_WORKSPACE '_out/erelia-preview'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $required = @('client', 'server-router', 'remote-node', 'example-node')
          foreach ($app in $required) {
            if (@(Get-ChildItem (Join-Path $appBuild $app) -Filter '*.exe' -File -ErrorAction SilentlyContinue).Count -ne 1) {
              throw "Required executable missing or ambiguous in $app"
            }
          }

          $executables = @(Get-ChildItem -Path $appBuild -Recurse -Filter '*.exe' -File)
          foreach ($executable in $executables) {
            $relative = [System.IO.Path]::GetRelativePath($appBuild, $executable.DirectoryName)
            $targetDir = Join-Path $stage $relative
            New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
            Copy-Item -LiteralPath $executable.FullName -Destination $targetDir
            if ($relative -eq 'client') {
              $clientConfig = Join-Path $executable.DirectoryName 'client.json'
              if (-not (Test-Path $clientConfig)) { throw 'Client binary is missing its adjacent client.json' }
              Copy-Item -LiteralPath $clientConfig -Destination $targetDir
            }
          }
          $configDir = Join-Path $stage 'config/examples'
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          Copy-Item -Path 'erelia/config/examples/*.json' -Destination $configDir
          Copy-Item -LiteralPath 'erelia/docs/development/m1-build-and-nodes.md' -Destination (Join-Path $stage 'BUILD-AND-RUN.md')
          @'
          Erelia M1 engineering scaffold preview (Windows x64)
          ====================================================
          This archive includes the Client, Router, generic Server/RemoteNode
          and every compiled specialized node (including ExampleNode).
          It is not a playable MMO. Routing and Client connectivity are not implemented.

          From the extracted archive directory, in PowerShell:
          & ".\server-router\Erelia - Router.exe" --config ".\config\examples\router.json"
          & ".\remote-node\Erelia - Server.exe" --config ".\config\examples\world-node.json"
          & ".\client\Erelia - Client.exe"

          The Client reads client.json beside its own executable.
          Run a second server instance with chat-node.json on its separate port.
          MockPlayer graphical tests and strict M0 traceability remain pending
          until their separately approved M1 infrastructure is implemented.
          '@ | Set-Content -Path (Join-Path $stage 'README.txt') -Encoding utf8
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath '_out/Erelia-M1-Windows-x64-preview.zip' -Force

      - name: Upload downloadable Windows scaffold preview
        uses: actions/upload-artifact@v4
        with:
          name: erelia-m1-windows-x64-preview
          path: _out/Erelia-M1-Windows-x64-preview.zip
          if-no-files-found: error

  linux_build:
    name: "Linux / 00 - Compile installed Sparkle Core and Erelia"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout Erelia
        uses: actions/checkout@v4
        with:
          path: erelia

      - name: Checkout pinned Sparkle 0.1.3
        uses: actions/checkout@v4
        with:
          repository: EreliaStudio/Sparkle
          ref: 5117c64a7052457ca2de1864bf23e0e29487bdcf
          path: _deps/sparkle-source

      - name: Install headless Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtest-dev

      - name: Build and install Sparkle Core only
        run: |
          cmake -S _deps/sparkle-source -B _out/sparkle-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DSPARKLE_BUILD_GRAPHICS=OFF \
            -DSPARKLE_BUILD_TESTS=OFF \
            -DSPARKLE_BUILD_TEST_LIBRARY=OFF \
            "-DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/_out/sparkle-prefix"
          cmake --build _out/sparkle-build --parallel 4
          cmake --install _out/sparkle-build

      - name: Build Core, Router, Servers and headless tests
        run: |
          cmake -S erelia -B _out/erelia-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DERELIA_BUILD_GRAPHICS=OFF \
            "-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/_out/sparkle-prefix" \
            -DBUILD_TESTING=ON
          cmake --build _out/erelia-build --parallel 4

      - name: Pack Linux build with executable permissions preserved
        run: tar -czf _out/erelia-linux-build.tar.gz -C _out erelia-build

      - name: Upload shared Linux CTest binaries
        uses: actions/upload-artifact@v4
        with:
          name: erelia-m1-linux-ci-build
          path: _out/erelia-linux-build.tar.gz
          retention-days: 2
          if-no-files-found: error

  linux_tests:
    name: "Linux / ${{ matrix.check }}"
    needs: linux_build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: "01 - Sparkle Addon Core"
            family: SparkleAddonCore
          - check: "03 - Erelia Core"
            family: Core
          - check: "04 - Erelia Router"
            family: Router
          - check: "06 - Erelia Server"
            family: Server
          - check: "07 - Headless Integration"
            family: ClientServerIntegration
    steps:
      - name: Checkout Erelia
        uses: actions/checkout@v4
        with:
          path: erelia

      - name: Download shared Linux build
        uses: actions/download-artifact@v4
        with:
          name: erelia-m1-linux-ci-build
          path: _out

      - name: Restore executable permissions and compiled tests
        run: tar -xzf _out/erelia-linux-build.tar.gz -C _out

      - name: Run ${{ matrix.family }} CTest suite
        run: |
          mkdir -p _out/test-reports
          ctest --test-dir _out/erelia-build \
            -L '^${{ matrix.family }}$' \
            --no-tests=error --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/_out/test-reports/${{ matrix.family }}.xml"

      - name: Upload Linux ${{ matrix.family }} report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erelia-linux-${{ matrix.family }}-ctest
          path: _out/test-reports/*.xml
          if-no-files-found: warn
